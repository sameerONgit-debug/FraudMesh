version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fraudmesh-postgres
    environment:
      POSTGRES_DB: fraudmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/raw:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudmesh-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.12
    container_name: fraudmesh-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudmesh-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: fraudmesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudmesh-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fraudmesh-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fraudmesh
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      APP_ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./data:/data
      - ./services/ml-training/models:/models
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - fraudmesh-network

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fraudmesh-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev
    networks:
      - fraudmesh-network

  # ML Training Service (on-demand)
  ml-training:
    build:
      context: .
      dockerfile: services/ml-training/Dockerfile
    container_name: fraudmesh-ml-training
    volumes:
      - ./services/ml-training:/app
      - ./data:/data
      - ./services/ml-training/models:/models
    depends_on:
      - postgres
    networks:
      - fraudmesh-network
    profiles:
      - training

  # Simulator Service (on-demand)
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    container_name: fraudmesh-simulator
    volumes:
      - ./services/simulator:/app
      - ./data/synthetic:/data/synthetic
    depends_on:
      - postgres
      - neo4j
    networks:
      - fraudmesh-network
    profiles:
      - simulator

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  fraudmesh-network:
    driver: bridge

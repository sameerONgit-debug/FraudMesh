[Version]
Capabilities:
    Channel: V2_0
    Orderer: V2_0
    Application: V2_0

[Organizations]
    [[Organizations]]
        Name = "Org1MSP"
        ID = "Org1MSP"
        MSPDir = "crypto-config/peerOrganizations/org1.fraudmesh/msp"
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org1MSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('Org1MSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('Org1MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org1MSP.peer')"

    [[Organizations]]
        Name = "Org2MSP"
        ID = "Org2MSP"
        MSPDir = "crypto-config/peerOrganizations/org2.fraudmesh/msp"
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org2MSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('Org2MSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('Org2MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org2MSP.peer')"

    [[Organizations]]
        Name = "Org3MSP"
        ID = "Org3MSP"
        MSPDir = "crypto-config/peerOrganizations/org3.fraudmesh/msp"
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('Org3MSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('Org3MSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('Org3MSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('Org3MSP.peer')"

[OrdererDefaults]
    Addresses:
        - orderer.fraudmesh:7050
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Kafka:
        Brokers:
            - 127.0.0.1:9092
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "MAJORITY BlockValidation"

[ApplicationDefaults]
    ACLs: &ApplicationACLs
        _lifecycle/CheckCommitReadiness: /Channel/Application/Writers
        _lifecycle/CommitChaincodeDefinition: /Channel/Application/Writers
        _lifecycle/QueryChaincodeDefinition: /Channel/Application/Readers
        cscc/GetConfigDefinition: /Channel/Application/Readers
        lscc/ChaincodeExists: /Channel/Application/Readers
        lscc/GetDeploymentSpec: /Channel/Application/Readers
        lscc/GetChaincodeData: /Channel/Application/Readers
        lscc/GetInstantiatedChaincodes: /Channel/Application/Readers
        qscc/GetChainInfo: /Channel/Application/Readers
        qscc/GetBlockByNumber: /Channel/Application/Readers
        qscc/GetBlockByHash: /Channel/Application/Readers
        qscc/GetTransactionByID: /Channel/Application/Readers
        qscc/GetBlockByTxID: /Channel/Application/Readers
        qscc/GetChaincodeInstallation: /Channel/Application/Readers
        escc/Verify: /Channel/Application/Readers
        vscc/ValidateTx: /Channel/Application/Readers
    Organizations:
    Policies: &ApplicationDefaultPolicies
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        Application: V2_0

[ChannelDefaults]
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        Channel: V2_0

[Profiles]
    FraudMeshOrdererGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
            Policies:
                Readers:
                    Type: ImplicitMeta
                    Rule: "ANY Readers"
                Writers:
                    Type: ImplicitMeta
                    Rule: "ANY Writers"
                Admins:
                    Type: ImplicitMeta
                    Rule: "MAJORITY Admins"
                BlockValidation:
                    Type: ImplicitMeta
                    Rule: "MAJORITY BlockValidation"
        Consortiums:
            FraudMeshConsortium:
                Organizations:
                    - Name: Org1MSP
                      ID: Org1MSP
                      MSPDir: crypto-config/peerOrganizations/org1.fraudmesh/msp
                      Policies:
                          Readers:
                              Type: Signature
                              Rule: OR('Org1MSP.member')
                          Writers:
                              Type: Signature
                              Rule: OR('Org1MSP.member')
                          Admins:
                              Type: Signature
                              Rule: OR('Org1MSP.admin')
                    - Name: Org2MSP
                      ID: Org2MSP
                      MSPDir: crypto-config/peerOrganizations/org2.fraudmesh/msp
                      Policies:
                          Readers:
                              Type: Signature
                              Rule: OR('Org2MSP.member')
                          Writers:
                              Type: Signature
                              Rule: OR('Org2MSP.member')
                          Admins:
                              Type: Signature
                              Rule: OR('Org2MSP.admin')
                    - Name: Org3MSP
                      ID: Org3MSP
                      MSPDir: crypto-config/peerOrganizations/org3.fraudmesh/msp
                      Policies:
                          Readers:
                              Type: Signature
                              Rule: OR('Org3MSP.member')
                          Writers:
                              Type: Signature
                              Rule: OR('Org3MSP.member')
                          Admins:
                              Type: Signature
                              Rule: OR('Org3MSP.admin')
    FraudMeshChannel:
        Consortium: FraudMeshConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - <<: *Organization
                  Name: Org1MSP
                  ID: Org1MSP
                  MSPDir: crypto-config/peerOrganizations/org1.fraudmesh/msp
                  Policies:
                      Readers:
                          Type: Signature
                          Rule: OR('Org1MSP.member')
                      Writers:
                          Type: Signature
                          Rule: OR('Org1MSP.member')
                      Admins:
                          Type: Signature
                          Rule: OR('Org1MSP.admin')
                      Endorsement:
                          Type: Signature
                          Rule: OR('Org1MSP.peer')
                - <<: *Organization
                  Name: Org2MSP
                  ID: Org2MSP
                  MSPDir: crypto-config/peerOrganizations/org2.fraudmesh/msp
                  Policies:
                      Readers:
                          Type: Signature
                          Rule: OR('Org2MSP.member')
                      Writers:
                          Type: Signature
                          Rule: OR('Org2MSP.member')
                      Admins:
                          Type: Signature
                          Rule: OR('Org2MSP.admin')
                      Endorsement:
                          Type: Signature
                          Rule: OR('Org2MSP.peer')
                - <<: *Organization
                  Name: Org3MSP
                  ID: Org3MSP
                  MSPDir: crypto-config/peerOrganizations/org3.fraudmesh/msp
                  Policies:
                      Readers:
                          Type: Signature
                          Rule: OR('Org3MSP.member')
                      Writers:
                          Type: Signature
                          Rule: OR('Org3MSP.member')
                      Admins:
                          Type: Signature
                          Rule: OR('Org3MSP.admin')
                      Endorsement:
                          Type: Signature
                          Rule: OR('Org3MSP.peer')
            Capabilities:
                Application: V2_0

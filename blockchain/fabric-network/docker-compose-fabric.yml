version: '3.8'

services:
  # Certificate Authority for Org1 (BANK_A)
  ca_org1:
    image: hyperledger/fabric-ca:latest
    container_name: fraudmesh-ca-org1
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org1.fraudmesh-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org1.fraudmesh-key.pem
      - FABRIC_CA_SERVER_ADMIN_USER=admin
      - FABRIC_CA_SERVER_ADMIN_PASSWORD=adminpw
    ports:
      - "7054:7054"
    volumes:
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org1.fraudmesh/ca:/etc/hyperledger/fabric-ca-server
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org1.fraudmesh/tlsca:/etc/hyperledger/fabric-ca-server-tls
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - fraudmesh-network

  # Certificate Authority for Org2 (BANK_B)
  ca_org2:
    image: hyperledger/fabric-ca:latest
    container_name: fraudmesh-ca-org2
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org2.fraudmesh-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org2.fraudmesh-key.pem
      - FABRIC_CA_SERVER_ADMIN_USER=admin
      - FABRIC_CA_SERVER_ADMIN_PASSWORD=adminpw
    ports:
      - "8054:7054"
    volumes:
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org2.fraudmesh/ca:/etc/hyperledger/fabric-ca-server
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org2.fraudmesh/tlsca:/etc/hyperledger/fabric-ca-server-tls
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - fraudmesh-network

  # Certificate Authority for Org3 (BANK_C)
  ca_org3:
    image: hyperledger/fabric-ca:latest
    container_name: fraudmesh-ca-org3
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org3.fraudmesh-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-tls/tlsca.org3.fraudmesh-key.pem
      - FABRIC_CA_SERVER_ADMIN_USER=admin
      - FABRIC_CA_SERVER_ADMIN_PASSWORD=adminpw
    ports:
      - "9054:7054"
    volumes:
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org3.fraudmesh/ca:/etc/hyperledger/fabric-ca-server
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org3.fraudmesh/tlsca:/etc/hyperledger/fabric-ca-server-tls
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    networks:
      - fraudmesh-network

  # Orderer Service
  orderer:
    image: hyperledger/fabric-orderer:latest
    container_name: fraudmesh-orderer
    environment:
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_KAFKA_VERBOSE=true
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer:8443
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderers
    ports:
      - "7050:7050"
      - "8443:8443"
    volumes:
      - ./blockchain/fabric-network/crypto-config/ordererOrganizations/fraudmesh/orderers/orderer.fraudmesh/msp:/var/hyperledger/orderer/msp
      - ./blockchain/fabric-network/crypto-config/ordererOrganizations/fraudmesh/orderers/orderer.fraudmesh/tls/:/var/hyperledger/orderer/tls
      - ./blockchain/fabric-network/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    networks:
      - fraudmesh-network

  # Peer0 for Org1 (BANK_A)
  peer0.org1:
    image: hyperledger/fabric-peer:latest
    container_name: fraudmesh-peer0-org1
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fraudmesh-network
      - CORE_PEER_ID=peer0.org1.fraudmesh
      - CORE_PEER_ADDRESS=peer0.org1:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LOGGING_LEVEL=INFO
      - CORE_LOGGING_PEER=INFO
      - CORE_LOGGING_CAUTION=INFO
      - CORE_LOGGING_GOPATH=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLSCA_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLSCA_CERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/
    depends_on:
      - couchdb0
      - ca_org1
    ports:
      - "7051:7051"
      - "7052:7052"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org1.fraudmesh/peers/peer0.org1.fraudmesh/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org1.fraudmesh/peers/peer0.org1.fraudmesh/tls:/etc/hyperledger/fabric/tls
      - peer0_org1_data:/var/hyperledger/production
    networks:
      - fraudmesh-network

  # CouchDB for Peer0 Org1
  couchdb0:
    container_name: fraudmesh-couchdb0
    image: couchdb:3.1.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - fraudmesh-network

  # Peer0 for Org2 (BANK_B)
  peer0.org2:
    image: hyperledger/fabric-peer:latest
    container_name: fraudmesh-peer0-org2
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fraudmesh-network
      - CORE_PEER_ID=peer0.org2.fraudmesh
      - CORE_PEER_ADDRESS=peer0.org2:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2:8051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/
    depends_on:
      - couchdb1
      - ca_org2
    ports:
      - "8051:8051"
      - "8052:8052"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org2.fraudmesh/peers/peer0.org2.fraudmesh/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org2.fraudmesh/peers/peer0.org2.fraudmesh/tls:/etc/hyperledger/fabric/tls
      - peer0_org2_data:/var/hyperledger/production
    networks:
      - fraudmesh-network

  # CouchDB for Peer0 Org2
  couchdb1:
    container_name: fraudmesh-couchdb1
    image: couchdb:3.1.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    networks:
      - fraudmesh-network

  # Peer0 for Org3 (BANK_C)
  peer0.org3:
    image: hyperledger/fabric-peer:latest
    container_name: fraudmesh-peer0-org3
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fraudmesh-network
      - CORE_PEER_ID=peer0.org3.fraudmesh
      - CORE_PEER_ADDRESS=peer0.org3:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3:9051
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LOGGING_LEVEL=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric/
    depends_on:
      - couchdb2
      - ca_org3
    ports:
      - "9051:9051"
      - "9052:9052"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org3.fraudmesh/peers/peer0.org3.fraudmesh/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/fabric-network/crypto-config/peerOrganizations/org3.fraudmesh/peers/peer0.org3.fraudmesh/tls:/etc/hyperledger/fabric/tls
      - peer0_org3_data:/var/hyperledger/production
    networks:
      - fraudmesh-network

  # CouchDB for Peer0 Org3
  couchdb2:
    container_name: fraudmesh-couchdb2
    image: couchdb:3.1.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    networks:
      - fraudmesh-network

  # CLI Tool for network management
  cli:
    image: hyperledger/fabric-tools:latest
    container_name: fraudmesh-cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.fraudmesh/users/Admin@org1.fraudmesh/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.fraudmesh/peers/peer0.org1.fraudmesh/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.fraudmesh/peers/peer0.org1.fraudmesh/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.fraudmesh/peers/peer0.org1.fraudmesh/tls/ca.crt
    depends_on:
      - peer0.org1
      - peer0.org2
      - peer0.org3
      - orderer
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/fabric-network/crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./blockchain/fabric-network/scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
      - ./blockchain/fabric-network/channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ./blockchain/chaincode/go:/opt/gopath/src/github.com/hyperledger/fabric/examples/chaincode/go
    networks:
      - fraudmesh-network

volumes:
  peer0_org1_data:
  peer0_org2_data:
  peer0_org3_data:

networks:
  fraudmesh-network:
    external: true
